name: Build PAK-AL09 Arch Live

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build PAK-AL09 (${{ matrix.kernel_variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    # 只有本 job 需要写 Release（tag 发布 / main 的 latest 预发布）。
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        kernel_variant: [stock, planck]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Free disk on ephemeral runner
        run: |
          df -h /
          for path in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup; do
            if [[ -d "${path}" ]]; then
              sudo rm -rf --one-file-system -- "${path}"
            fi
          done
          docker system prune --all --force || true
          df -h /

      - name: Install host dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bc bison build-essential ca-certificates cpio curl device-tree-compiler \
            dirmngr dosfstools e2fsprogs file flex gcc-aarch64-linux-gnu gdisk git gnupg \
            kmod libarchive-tools libelf-dev libssl-dev mtools patch qemu-user-static \
            rsync squashfs-tools xorriso zstd

      - name: Restore kernel build cache
        id: kernel-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .cache/kernel-cache
          key: kernel-${{ matrix.kernel_variant }}-${{ hashFiles('configs/versions.env', 'configs/device.env', 'configs/kernel.fragment', 'configs/kernel.planck.fragment', 'analysis/bios-1.16/patches/*.patch', 'scripts/build-kernel.sh', 'scripts/fetch-sources.sh') }}

      - name: Build kernel
        env:
          CLEAN_INTERMEDIATES: '1'
          KERNEL_VARIANT: ${{ matrix.kernel_variant }}
          STAGE: kernel
        run: sudo --preserve-env=GITHUB_ACTIONS,CLEAN_INTERMEDIATES,KERNEL_VARIANT,STAGE bash scripts/build.sh

      - name: Save kernel build cache
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .cache/kernel-cache
          key: kernel-${{ matrix.kernel_variant }}-${{ hashFiles('configs/versions.env', 'configs/device.env', 'configs/kernel.fragment', 'configs/kernel.planck.fragment', 'analysis/bios-1.16/patches/*.patch', 'scripts/build-kernel.sh', 'scripts/fetch-sources.sh') }}

      - name: Build rootfs and media (minimal + kde + gnome + xfce)
        env:
          CLEAN_INTERMEDIATES: '1'
          KERNEL_VARIANT: ${{ matrix.kernel_variant }}
          STAGE: media
        run: |
          set -Eeuo pipefail
          for flavor in minimal kde gnome xfce; do
            echo "=== building Live flavor: ${flavor} ==="
            sudo --preserve-env=GITHUB_ACTIONS,CLEAN_INTERMEDIATES,KERNEL_VARIANT,STAGE \
              env LIVE_FLAVOR="${flavor}" bash scripts/build.sh
          done

      - name: Report final disk use
        if: always()
        run: df -h /

      - name: Verify release checksums
        env:
          KERNEL_VARIANT: ${{ matrix.kernel_variant }}
        run: (cd out && sha256sum --check "SHA256SUMS-${KERNEL_VARIANT}")

      # 不再使用 actions/upload-artifact（它总会生成 zip）。直接把 out/ 下每个
      # 产物作为独立 Release asset 上传；tag 构建发布正式版，main 构建更新 latest
      # 预发布。PR 构建只做校验，不上传。
      - name: Upload individual release assets
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          KERNEL_VARIANT: ${{ matrix.kernel_variant }}
        run: |
          set -Eeuo pipefail
          cd out
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            title="PAK-AL09 Arch Linux ARM Live ${tag}"
            notes="Tag build ${GITHUB_SHA} with stock and planck kernel variants."
            prerelease=()
          else
            tag="latest"
            title="PAK-AL09 Arch Linux ARM Live (latest main build)"
            notes="Rolling build from main at ${GITHUB_SHA} with stock and planck kernel variants."
            prerelease=(--prerelease)
          fi

          ensure_release() {
            gh release view "${tag}" >/dev/null 2>&1 && return 0
            if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
              gh release create "${tag}" --verify-tag --title "${title}" --notes "${notes}"
            else
              gh release create "${tag}" --target "${GITHUB_SHA}" \
                --title "${title}" --notes "${notes}" "${prerelease[@]}"
            fi
          }
          # 两个 matrix job 会并发发布同一 Release；另一个 job 已创建时视为成功。
          ensure_release || gh release view "${tag}" >/dev/null
          # 逐个文件上传（含 SHA256SUMS），已存在则覆盖。
          gh release upload "${tag}" ./* --clobber
