name: Build ARM64 Recovery PE (Win10 2004)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: winpe-arm64-win10-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Windows 10 2004 ADK and WinPE add-on
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          function Install-AdkPackage {
            param(
              [string]$Url,
              [string]$ExpectedSha256,
              [string]$FileName,
              [string[]]$Arguments
            )
            $output = Join-Path $env:RUNNER_TEMP $FileName
            Invoke-WebRequest -Uri $Url -OutFile $output -UseBasicParsing
            $actual = (Get-FileHash -LiteralPath $output -Algorithm SHA256).Hash
            if ($actual -ne $ExpectedSha256) {
              throw "Checksum mismatch for ${FileName}: $actual"
            }
            $process = Start-Process -FilePath $output -ArgumentList $Arguments `
              -Wait -PassThru -NoNewWindow
            if ($process.ExitCode -notin @(0, 3010)) {
              throw "Installer $FileName failed: $($process.ExitCode)"
            }
          }
          Install-AdkPackage `
            -Url 'https://go.microsoft.com/fwlink/?linkid=2120254' `
            -ExpectedSha256 '79FFC10E1A7E2E699083467DB601D9747F71A419981B458063DE1A86FD8C47DD' `
            -FileName 'adksetup-19041.exe' `
            -Arguments @('/quiet', '/features', 'OptionId.DeploymentTools')
          Install-AdkPackage `
            -Url 'https://go.microsoft.com/fwlink/?linkid=2120253' `
            -ExpectedSha256 '39BB281EA5D631C7E0F989C53DBCD317BD5A6C4EEFF82B41B40256744D2C5D5D' `
            -FileName 'adkwinpesetup-19041.exe' `
            -Arguments @(
              '/quiet',
              '/features',
              'OptionId.WindowsPreinstallationEnvironment'
            )
          $arm64Media = Join-Path ${env:ProgramFiles(x86)} `
            'Windows Kits\10\Assessment and Deployment Kit\Windows Preinstallation Environment\arm64\media'
          if (-not (Test-Path -LiteralPath $arm64Media)) {
            throw "Windows 10 2004 ARM64 WinPE media was not installed: $arm64Media"
          }

      - name: Build Windows 10 2004 ARM64 recovery ISO
        shell: powershell
        run: |
          .\winpe\Build-WinPE.ps1 `
            -RepositoryRoot $env:GITHUB_WORKSPACE `
            -OutputDirectory (Join-Path $env:GITHUB_WORKSPACE 'out-winpe-win10') `
            -AdkVersion '10.1.19041.1 (Windows 10 2004)'

      - name: Upload Windows 10 2004 ARM64 recovery PE
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: matebook-e2019-arm64-recovery-pe-win10
          path: out-winpe-win10/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
