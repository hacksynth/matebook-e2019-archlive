name: Build ARM64 Recovery PE

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: winpe-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install matched Windows ADK and WinPE add-on
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          function Install-MsiPackage {
            param(
              [string]$Url,
              [string]$ExpectedSha256,
              [string]$FileName,
              [string[]]$Arguments
            )
            $output = Join-Path $env:RUNNER_TEMP $FileName
            Invoke-WebRequest -Uri $Url -OutFile $output -UseBasicParsing
            $actual = (Get-FileHash -LiteralPath $output -Algorithm SHA256).Hash
            if ($actual -ne $ExpectedSha256) {
              throw "Checksum mismatch for ${FileName}: $actual"
            }
            $process = Start-Process -FilePath $output -ArgumentList $Arguments `
              -Wait -PassThru -NoNewWindow
            if ($process.ExitCode -notin @(0, 3010)) {
              throw "Installer $FileName failed: $($process.ExitCode)"
            }
          }
          Install-MsiPackage `
            -Url 'https://go.microsoft.com/fwlink/?linkid=2289980' `
            -ExpectedSha256 'AC6A930FDB5C2980BA5FEFE606D47EDAAFCF5F647B4337411500D158EA77300F' `
            -FileName 'adksetup.exe' `
            -Arguments @('/quiet', '/features', 'OptionId.DeploymentTools')
          Install-MsiPackage `
            -Url 'https://go.microsoft.com/fwlink/?linkid=2289981' `
            -ExpectedSha256 'D4DE67ACC83DE253CCC941DD0590808D83726BDD8EA768A374A7BEAFF7949D6A' `
            -FileName 'winpesetup.exe' `
            -Arguments @('/quiet')
          $copyPe = Join-Path ${env:ProgramFiles(x86)} `
            'Windows Kits\10\Assessment and Deployment Kit\Windows Preinstallation Environment\copype.cmd'
          if (-not (Test-Path -LiteralPath $copyPe)) {
            throw "WinPE build tools were not installed: $copyPe"
          }

      - name: Build ARM64 recovery ISO
        shell: powershell
        run: |
          .\winpe\Build-WinPE.ps1 `
            -RepositoryRoot $env:GITHUB_WORKSPACE `
            -OutputDirectory (Join-Path $env:GITHUB_WORKSPACE 'out-winpe')

      - name: Upload ARM64 recovery PE
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: matebook-e2019-arm64-recovery-pe
          path: out-winpe/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
