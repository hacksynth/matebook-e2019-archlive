set default=0
set timeout=10

menuentry 'Arch Linux ARM Live — HUAWEI MateBook E 2019 (PAK-AL09)' {
    insmod gzio
    insmod part_gpt
    insmod fat
    insmod ext2
    insmod iso9660
    search --no-floppy --label PAKAL09LIVE --set=root
    linux /boot/Image root=live:LABEL=PAKAL09LIVE rd.live.image rd.live.dir=arch rd.live.squashimg=airootfs.sfs rd.overlay rw console=tty0 pd_ignore_unused clk_ignore_unused qcom_scm.qseecom=auto
    devicetree /boot/dtb/qcom/sdm850-huawei-matebook-e-2019.dtb
    initrd /boot/initramfs-live.img
}

menuentry 'Arch Linux ARM Live — 禁用 QSEECom（故障排查）' {
